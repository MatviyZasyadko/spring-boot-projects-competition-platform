<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title>Competitors - Competition</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link th:href="@{/main.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body class="bg-gray-50">
<header th:replace="~{layout/header :: header}"></header>
<main class="p-5 md:w-[85%] md:p-0 mx-auto min-h-screen">
    <div class="page-block">
        <div class="flex justify-center">
            <h2 class="text-3xl text-center leading-[3.75rem] font-bold font-palanquin">Competition</h2>
        </div>
        <div class="flex justify-center">
            <div class="mt-6 flex gap-16 items-start max-w-2/3">
                <div>
                    <div>
                        <img class="object-cover rounded-lg shadow-md h-64 w-56"
                             th:src="${competition.logo == null} ? '/default-image.jpg' : ${competition.logo.url}"
                             alt="competition logo"
                             id="project_logo"
                        >
                    </div>
                    <div class="mt-5">
                        <div class="mt-2">
                            <p class="border-b border-gray-300 py-1">
                                Organizer
                            </p>
                        </div>
                        <div id="profile-name"
                             class="mt-4 flex select-none min-w-48 items-center gap-2 text-gray-800 hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm">
                            <div>
                                <img class="w-7 h-7 rounded-full select-none"
                                     th:src="${competition.organizer.logoUrl == null} ? '/unknown-user.jpg' : ${competition.getLogo().url}"
                                     alt="Rounded avatar">
                            </div>
                            <div class="select-none">
                                <span>Made by:</span> <span th:text="${competition.organizer.getFullName()}"></span>
                            </div>
                        </div>
                        <div class="mt-5">
                            <p class="border-b border-gray-300 py-1">
                                Participants amount
                            </p>
                            <p th:text="${competition.projects.size()}" class="mt-2">
                            </p>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex gap-3 items-center">
                        <p th:text="${competition.name}" class="text-3xl font-bold leading-loose"></p>

                        <div th:if="${competition.finished}" role="alert">
                            <span class="font-medium p-2 text-sm text-red-800 rounded-lg bg-red-100 inline-block">Finished</span>
                        </div>
                        <div th:if="${not competition.finished}" role="alert">
                            <div class="font-medium p-2 text-sm text-green-800 rounded-lg bg-green-100 inline-block">
                                <span>Active</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex gap-3 items-center">
                        <svg class="h-8 w-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                            <path d="M152 24c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 40L64 64C28.7 64 0 92.7 0 128l0 16 0 48L0 448c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-256 0-48 0-16c0-35.3-28.7-64-64-64l-40 0 0-40c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 40L152 64l0-40zM48 192l352 0 0 256c0 8.8-7.2 16-16 16L64 464c-8.8 0-16-7.2-16-16l0-256z"/>
                        </svg>
                        <div class="flex flex-col items-start gap-1">
                            <p class="font-bold">
                                Finish date
                            </p>

                            <p class="text-sm"
                               th:text="${competition.votingEndDate.toString().replaceAll('T', ' ').substring(0, 16)}">
                            </p>

                        </div>
                    </div>

                    <div class="mt-6 flex gap-3 items-center">
                        <svg class="h-8 w-8" fill="#000000" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path d="M21,2H3A1,1,0,0,0,2,3V21a1,1,0,0,0,1,1H21a1,1,0,0,0,1-1V3A1,1,0,0,0,21,2ZM4,4H20V6H4ZM20,20H4V8H20ZM6,12a1,1,0,0,1,1-1H17a1,1,0,0,1,0,2H7A1,1,0,0,1,6,12Zm0,4a1,1,0,0,1,1-1h5a1,1,0,0,1,0,2H7A1,1,0,0,1,6,16Z"></path>
                            </g>
                        </svg>
                        <div class="flex flex-col items-start gap-1">
                            <p class="font-bold">
                                Description
                            </p>

                            <p class="text-sm" th:text="${competition.description}"></p>
                        </div>
                    </div>

                    <div class="relative mt-8">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center">
                        <span class="px-2 bg-white text-black">
                            Actions
                        </span>
                        </div>
                    </div>

                    <div class="flex justify-center gap-3 mt-6">
                        <div th:if="${#authentication.principal.id == competition.organizer.id}">
                            <form th:action="'/ui/competitions/delete/' + ${competition.id}">
                                <button type="submit"
                                        class="focus:outline-none text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:ring-red-300 font-medium rounded-lg p-1.5 slow-animation-300">
                                    Delete competition
                                </button>
                            </form>
                        </div>
                        <div th:if="${not competition.finished}">
                            <button type="button" data-modal-target="apply-project-modal"
                                    data-modal-toggle="apply-project-modal"
                                    class="primary-button font-medium p-1.5">
                                Apply a project
                            </button>
                        </div>
                        <div th:if="${#authentication.principal.id == competition.organizer.id && not competition.finished}">
                            <form th:action="'/ui/competitions/' + ${competition.id} + '/finish'">
                                <button type="submit" data-modal-target="apply-project-modal"
                                        data-modal-toggle="apply-project-modal"
                                        class="primary-button font-medium p-1.5">
                                    Finish a competition
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="page-block mt-10" th:if="${competition.finished}">
        <div class="flex justify-center">
            <h2 class="text-3xl text-center leading-[3.75rem] font-bold font-palanquin">Results</h2>
        </div>
        <div class="flex justify-center items-center" th:if="${isEmpty}">
            <p class="w-80 h-40 text-xl  text-gray-500">
                Competition does not have applied projects or votes
            </p>
        </div>
    </div>

    <div class="page-block mt-10">
        <div class="flex justify-center">
            <h2 class="text-3xl text-center leading-[3.75rem] font-bold font-palanquin">Participants</h2>
        </div>
        <div class="flex justify-center items-center" th:if="${competition.projects.size() == 0}">
            <p class="w-80 h-40 text-xl  text-gray-500">
                Competition does not have projects
            </p>
        </div>

        <div th:if="${competition.projects.size() != 0}">
            <form th:action="@{/ui/competitions/{competitionId}/vote(competitionId=${competition.id})}"
                  th:object="${selectedProjectDto}"
                  method="POST">
                <div class="mt-5" th:each="participant : ${competition.projects}">
                    <div class="flex justify-between mb-4">
                        <label class="text-base font-medium text-black">
                            <div class="flex items-center">
                                <input type="radio" th:id="'projectOption_' + ${participant.id}" class="mr-2"
                                       th:name="projectOption"
                                       th:value="${participant.id}"
                                       th:field="*{projectId}">
                                <label th:for="'projectOption_' + ${participant.id}" class="text-sm">
                                    <span th:text="${participant.name}"></span>
                                    <span class="ml-2 text-gray-700"
                                          th:if="${competition.voteDto != null && competition.voteDto.projectId == participant.id}">
                                        (You voted for this project)
                                    </span>
                                </label>
                            </div>
                        </label>

                        <span class="text-sm font-medium text-black">
                    <span th:text="${competition.totalVotesAmount == 0 ? 0 : ((participant.votesAmount / competition.totalVotesAmount) * 100)}"></span>
                    <span>%</span>
                </span>
                    </div>

                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div class="bg-gray-600 h-2.5 rounded-full"
                             th:style="'width:' + ${competition.totalVotesAmount == 0 ? 0 : (participant.votesAmount / competition.totalVotesAmount) * 100} + '%'"></div>
                    </div>
                </div>

                <div class="mt-10">
                    <button th:if="${not competition.finished}" type="submit" class="primary-button p-1.5">
                        <span>
                            Submit a vote
                        </span>
                    </button>
                </div>
            </form>
        </div>

    </div>

    <div id="toast-warning"
         class="fixed flex justify-between items-center w-full max-w-xs p-4 space-x-4 text-gray-500 bg-white divide-x rtl:divide-x-reverse divide-gray-200 rounded-lg shadow bottom-5 left-5"
         role="alert"
         th:if="${param.error != null}"
    >
        <div class="flex items-center gap-2">
            <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-orange-500 bg-orange-100 rounded-lg">
                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                     viewBox="0 0 20 20">
                    <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM10 15a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm1-4a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v5Z"/>
                </svg>
                <span class="sr-only">Error</span>
            </div>
            <div class="ms-3 text-sm font-normal">
                <p th:text="${param.error}">
                </p>
            </div>
        </div>

        <div>
            <button type="button"
                    class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8"
                    data-dismiss-target="#toast-warning" aria-label="Close">
                <span class="sr-only">Close</span>
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                     viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
            </button>
        </div>
        <script>
          window.history.replaceState(null, '', window.location.pathname);
        </script>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>


<div id="apply-project-modal" tabindex="-1" aria-hidden="true"
     class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-md max-h-full">
        <div class="relative bg-white rounded-lg shadow">
            <div class="flex items-center justify-between p-2 md:p-5 border-b rounded-t">
                <h3 class="text-lg font-semibold text-gray-900">
                    Apply a project
                </h3>
                <button type="button"
                        class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
                        data-modal-toggle="apply-project-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <form class="p-4 md:p-5"
                  method="POST"
                  th:action="'/ui/competitions/' + ${competition.id} + '/apply'"
                  th:object="${projectApplyToCompetitionDto}"
            >
                <div class="col-span-2 sm:col-span-1 mb-7">
                    <label for="project-select" class="block mb-2 text-sm font-medium text-gray-900">Choose your
                        project</label>
                    <select th:field="*{projectId}" required id="project-select" class="w-full default-input">
                        <option value="" disabled>Select your project</option>
                        <option class="flex gap-5 items-center" th:text="${project.name}" th:value="${project.id}"
                                th:each="project: ${usersProjects}">
                        </option>
                    </select>
                </div>
                <button type="submit"
                        class="primary-button p-1.5 flex gap-1 items-center">
                    <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
                         xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd"
                              d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                              clip-rule="evenodd"></path>
                    </svg>
                    Apply a project
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title>Competitors - Project</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link th:href="@{/main.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body class="bg-gray-50">
<header th:replace="~{layout/header :: header}"></header>
<main class="p-5 md:w-[85%] md:p-0 mx-auto min-h-screen">
    <div class="page-block">
        <div class="flex justify-center">
            <div class="flex gap-10 items-start max-w-2/3">
                <div>
                    <div>
                        <img class="object-cover rounded-lg shadow-md h-64 w-56"
                             th:src="${competition.logo == null} ? '/default-image.jpg' : ${competition.logo.url}"
                             alt="competition logo"
                             id="project_logo"
                        >
                    </div>
                    <div class="mt-5">
                        <div class="mt-2">
                            <p class="border-b border-gray-300 py-1">
                                Organizer
                            </p>
                        </div>
                        <div id="profile-name"
                             class="mt-4 flex select-none min-w-48 items-center gap-2 text-gray-800 hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm">
                            <div>
                                <img class="w-7 h-7 rounded-full select-none"
                                     th:src="${competition.getLogo() == null} ? '/unknown-user.jpg' : ${competition.getLogo().url}"
                                     alt="Rounded avatar">
                            </div>
                            <div class="select-none te" th:text="${#authentication.principal.fullName}">
                                <span>Made by:</span> <span th:text="${competition.organizer.getFullName()}"></span>
                            </div>
                        </div>
                        <div class="mt-5">
                            <p class="border-b border-gray-300 py-1">
                                Participants amount
                            </p>
                            <p th:text="${competition.projects.size()}" class="mt-2">

                            </p>
                        </div>
                    </div>
                </div>

                <div>
                    <p class="text-3xl font-bold leading-loose">
                        VovaVovaVova fgdfdfdfdfdfff
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>

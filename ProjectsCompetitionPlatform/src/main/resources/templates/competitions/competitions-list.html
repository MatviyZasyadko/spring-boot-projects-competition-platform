<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title>Competitors - Competitions</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link th:href="@{/main.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body class="bg-gray-50">
<header th:replace="~{layout/header :: header}"></header>
<main class="p-5 md:w-[85%] md:p-0 mx-auto min-h-[95vh]">
    <h2 class="text-3xl text-center leading-[3.75rem] font-bold font-palanquin">All competitions</h2>
    <div class="mt-8 flex justify-between items-center gap-2 px-4">
        <div>
            <a class="secondary-white-button px-3 py-2.5 overflow-x-auto" th:href="@{/ui/competitions/create}">Create a
                new competition</a>
        </div>
    </div>
    <div>
        <div class="mt-10 grid grid-cols-[repeat(auto-fill,_minmax(300px,1fr))] gap-6">

            <div th:each="competition: ${competitions}"
                 class="max-w-sm bg-white border border-gray-200 rounded-lg shadow">
                <a href="#">
                    <div class="max-h-[300px] w-full">
                        <img class="rounded-t-lg object-cover max-h-[300px] w-full"
                             th:src="${competition.logo == null} ? '/default-image.jpg' : ${competition.logo.url}"
                             alt=""/>
                    </div>
                </a>
                <div class="p-5">
                    <a href="#">
                        <h5 class="mb-4 text-2xl font-bold tracking-tight text-gray-900"
                            th:text="${competition.name}"></h5>
                    </a>
                    <p class="mb-5 font-normal text-gray-700" th:text="${competition.description}"></p>

                    <div class="flex flex-col gap-2">
                        <div th:if="${competition.finished}" role="alert">
                            <span class="font-medium p-2 mb-5 text-sm text-red-800 rounded-lg bg-red-100 inline-block">Finished</span>
                        </div>
                        <div th:if="${not competition.finished}" role="alert">
                            <div class="font-medium p-2 mb-5 text-sm text-green-800 rounded-lg bg-green-100 inline-block">
                                <span>Active</span>
                            </div>
                        </div>
                    </div>

                    <a href="#"
                       class="inline-flex items-center p-2 text-sm font-medium text-center text-white bg-black rounded-lg hover:bg-gray-600">
                        Read more
                        <svg class="rtl:rotate-180 w-3.5 h-3.5 ms-2" aria-hidden="true"
                             xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M1 5h12m0 0L9 1m4 4L9 9"/>
                        </svg>
                    </a>
                </div>
            </div>


        </div>
    </div>
</main>

<script th:inline="javascript">
  /*<![CDATA[*/
  function redirectToSingleProjectPage(id) {
    window.location.href = `/ui/projects/${id}`;
  }

  /*]]>*/
</script>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>

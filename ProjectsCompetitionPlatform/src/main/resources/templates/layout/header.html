<!DOCTYPE HTML>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="header" class="z-50 mb-8">
    <nav class="bg-white border-gray-200 px-4 lg:px-6 py-1.5 shadow-md">
        <div class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl">
            <div class="flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-9">
                    <path fill-rule="evenodd"
                          d="M5.166 2.621v.858c-1.035.148-2.059.33-3.071.543a.75.75 0 0 0-.584.859 6.753 6.753 0 0 0 6.138 5.6 6.73 6.73 0 0 0 2.743 1.346A6.707 6.707 0 0 1 9.279 15H8.54c-1.036 0-1.875.84-1.875 1.875V19.5h-.75a2.25 2.25 0 0 0-2.25 2.25c0 .414.336.75.75.75h15a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-2.25-2.25h-.75v-2.625c0-1.036-.84-1.875-1.875-1.875h-.739a6.706 6.706 0 0 1-1.112-3.173 6.73 6.73 0 0 0 2.743-1.347 6.753 6.753 0 0 0 6.139-5.6.75.75 0 0 0-.585-.858 47.077 47.077 0 0 0-3.07-.543V2.62a.75.75 0 0 0-.658-.744 49.22 49.22 0 0 0-6.093-.377c-2.063 0-4.096.128-6.093.377a.75.75 0 0 0-.657.744Zm0 2.629c0 1.196.312 2.32.857 3.294A5.266 5.266 0 0 1 3.16 5.337a45.6 45.6 0 0 1 2.006-.343v.256Zm13.5 0v-.256c.674.1 1.343.214 2.006.343a5.265 5.265 0 0 1-2.863 3.207 6.72 6.72 0 0 0 .857-3.294Z"
                          clip-rule="evenodd"/>
                </svg>
                <a class="font-bold text-2xl" th:href="@{/ui/main}">Competitors</a>
            </div>
            <div class="flex items-center lg:order-2">
                <div class="relative">
                    <div id="profile-name"
                         class="flex select-none min-w-48 items-center gap-2 text-gray-800 hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 lg:px-5 py-2 lg:py-2.5 mr-2 focus:outline-none cursor-pointer">
                        <div>
                            <img class="w-7 h-7 rounded-full select-none"
                                 th:src="${#authentication.principal.logoUrl == null} ? '/unknown-user.jpg' : ${#authentication.principal.getLogoUrl()}"
                                 alt="Rounded avatar">
                        </div>
                        <p class="select-none" th:text="${#authentication.principal.fullName}">
                        </p>
                    </div>
                    <div id="dropdown-menu"
                         class="hidden select-none absolute flex-col items-center rounded-lg shadow z-20 w-32 left-[23%] bottom-[-5.0rem]">
                        <div class="w-full bg-white text-gray-800 hover:bg-gray-50 rounded-t-lg focus:ring-4 focus:ring-gray-300 font-medium text-sm px-4 lg:px-5 py-2 lg:py-2.5 focus:outline-none">
                            <a class="w-full h-full select-none" th:href="@{/ui/user-page}">Profile</a>
                        </div>
                        <div class="w-full bg-white text-gray-800 rounded-b-lg hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium text-sm px-4 lg:px-5 py-2 lg:py-2.5 focus:outline-none">
                            <a class="w-full h-full select-none" th:href="@{/ui/logout}">Log out</a>
                        </div>
                    </div>
                </div>
                <button data-collapse-toggle="mobile-menu-2" type="button"
                        class="inline-flex items-center p-2 ml-1 text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
                        aria-controls="mobile-menu-2" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd"
                              d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                              clip-rule="evenodd"></path>
                    </svg>
                    <svg class="hidden w-6 h-6" fill="currentColor" viewBox="0 0 20 20"
                         xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd"
                              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                              clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            <div class="hidden justify-between items-center w-full lg:flex lg:w-auto lg:order-1" id="mobile-menu-2">
                <ul class="flex flex-col mt-4 font-medium lg:flex-row lg:space-x-8 lg:mt-0">
                    <li>
                        <a th:href="@{/ui/main}"
                           class="block py-2 pr-4 pl-3 text-white rounded bg-primary-700 lg:bg-transparent lg:text-primary-700 lg:p-0 hover:decoration-1 hover:underline"
                           aria-current="page">Home</a>
                    </li>
                    <li>
                        <a th:href="@{/ui/projects}"
                           class="block py-2 pr-4 pl-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700 lg:p-0 hover:underline">Projects</a>
                    </li>
                    <li>
                        <a th:href="@{/ui/competitions}"
                           class="block py-2 pr-4 pl-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700 lg:p-0 hover:underline">Competitions</a>
                    </li>
                    <li>
                        <a th:href="@{/ui/reports}"
                           class="block py-2 pr-4 pl-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700 lg:p-0 hover:underline">Reports</a>
                    </li>
                    <li>
                        <a th:href="@{/ui/admin-page}"
                           sec:authorize="hasRole('ADMIN')"
                           class="block py-2 pr-4 pl-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700 lg:p-0 hover:underline">Admin
                            page</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <script>
      document.getElementById('profile-name').addEventListener('click', () => {
        const dropdownMenu = document.getElementById('dropdown-menu');
        dropdownMenu.classList.contains('lg:flex')
          ? dropdownMenu.classList.remove('lg:flex')
          : dropdownMenu.classList.add('lg:flex');
      });
    </script>
</header>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Competitors - Admin page</title>
    <link th:href="@{/main.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="bg-gray-50">
<header th:replace="~{layout/header :: header}"></header>

<main class="custom-container">
    <section class="page-block">
        <h2 class="text-3xl text-center leading-[3.75rem] font-bold font-palanquin">
            Admin panel
        </h2>
        <div class="flex justify-center">
            <div class="mt-8 max-w-sm w-full bg-white rounded-lg shadow p-4 md:p-6">
                <div class="flex justify-between">
                    <div>
                        <h5 class="leading-none text-3xl font-bold text-gray-900 pb-2">32.4k</h5>
                        <p class="text-base font-normal text-gray-500">Users this week</p>
                    </div>
                    <div
                            class="flex items-center px-2.5 py-0.5 text-base font-semibold text-green-500 text-center">
                        12%
                        <svg class="w-3 h-3 ms-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 10 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M5 13V1m0 0L1 5m4-4 4 4"/>
                        </svg>
                    </div>
                </div>
                <div id="area-chart"></div>
                <div class="grid grid-cols-1 items-center border-gray-200 border-t justify-between">
                    <div class="flex justify-between items-center pt-5">
                        <!-- Button -->
                        <button
                                id="dropdownDefaultButton"
                                data-dropdown-toggle="lastDaysdropdown"
                                data-dropdown-placement="bottom"
                                class="text-sm font-medium text-gray-500 hover:text-gray-900 text-center inline-flex items-center"
                                type="button">
                            Last 7 days
                            <svg class="w-2.5 m-2.5 ms-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                 fill="none" viewBox="0 0 10 6">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="m1 1 4 4 4-4"/>
                            </svg>
                        </button>
                        <!-- Dropdown menu -->
                        <div id="lastDaysdropdown"
                             class="z-10 hidden bg-white divide-y divide-gray-100 rounded-lg shadow w-44 ">
                            <ul class="py-2 text-sm text-gray-700"
                                aria-labelledby="dropdownDefaultButton">
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Yesterday</a>
                                </li>
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Today</a>
                                </li>
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Last
                                        7 days</a>
                                </li>
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Last
                                        30 days</a>
                                </li>
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Last
                                        90 days</a>
                                </li>
                            </ul>
                        </div>
                        <a
                                href="#"
                                class="uppercase text-sm font-semibold inline-flex items-center rounded-lg text-blue-600 hover:text-blue-700 hover:bg-gray-100 px-3 py-2">
                            Users Report
                            <svg class="w-2.5 h-2.5 ms-1.5 rtl:rotate-180" aria-hidden="true"
                                 xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="m1 9 4-4-4-4"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div> <!-- table with all reports -->
            <div class="mt-8 page-block">
                <div class="relative overflow-x-auto">
                    <div class="flex justify-center mt-3">
                        <h3 class="text-2xl text-center font-bold font-mono">
                            My reports
                        </h3>
                    </div>
                    <table class="mt-8 w-full text-sm text-left rtl:text-right">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3">
                                Topic
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Status
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Approve Date
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Description
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="report : ${allReports}" class="bg-white border-b">
                            <th scope="row" class="px-6 py-4 font-medium whitespace-nowrap">
                                <span th:text="${report.topic}"></span>
                            </th>
                            <th scope="row" class="px-6 py-4 font-medium whitespace-nowrap">
                                <span th:text="${report.reportStatus}"></span>
                            </th>
                            <th scope="row" class="px-6 py-4 font-medium whitespace-nowrap">
                                <span th:text="${report.approveDate != null ? report.approveDate : 'Not Approved'}"></span>
                            </th>
                            <td class="px-6 py-4">
                                <span th:text="${report.description}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script>
          const options = {
            chart: {
              height: '100%',
              maxWidth: '100%',
              type: 'area',
              fontFamily: 'Inter, sans-serif',
              dropShadow: {
                enabled: false,
              },
              toolbar: {
                show: false,
              },
            },
            tooltip: {
              enabled: true,
              x: {
                show: false,
              },
            },
            fill: {
              type: 'gradient',
              gradient: {
                opacityFrom: 0.55,
                opacityTo: 0,
                shade: '#1C64F2',
                gradientToColors: ['#1C64F2'],
              },
            },
            dataLabels: {
              enabled: false,
            },
            stroke: {
              width: 6,
            },
            grid: {
              show: false,
              strokeDashArray: 4,
              padding: {
                left: 2,
                right: 2,
                top: 0,
              },
            },
            series: [
              {
                name: 'New users',
                data: [6500, 6418, 6456, 6526, 6356, 6456],
                color: '#1A56DB',
              },
            ],
            xaxis: {
              categories: ['01 February', '02 February', '03 February', '04 February', '05 February', '06 February', '07 February'],
              labels: {
                show: false,
              },
              axisBorder: {
                show: false,
              },
              axisTicks: {
                show: false,
              },
            },
            yaxis: {
              show: false,
            },
          };

          if (document.getElementById('area-chart') && typeof ApexCharts !== 'undefined') {
            const chart = new ApexCharts(document.getElementById('area-chart'), options);
            chart.render();
          }
        </script>

    </section>
</main>

<!-- Modal -->
<div id="reportModal" class="fixed inset-0 bg-gray-500 bg-opacity-50 flex justify-center items-center hidden">
    <div class="bg-white p-6 rounded-lg w-1/2">
        <h3 class="text-2xl font-bold text-center mb-4">Report Details</h3>
        <div id="modalContent">
            <!-- Modal content will be injected here -->
        </div>
        <div class="flex justify-end space-x-4 mt-4">
            <button id="closeModal" class="px-4 py-2 bg-gray-500 text-white rounded">Close</button>
            <button id="approveReport" class="px-4 py-2 bg-blue-500 text-white rounded">Approve</button>
        </div>
    </div>
</div>


<footer th:replace="~{layout/footer :: footer}"></footer>

<script th:inline="javascript">
    // JavaScript to open the modal when clicking a row
    document.addEventListener("DOMContentLoaded", function () {
        const tableRows = document.querySelectorAll("tbody tr");
        const modal = document.getElementById("reportModal");
        const closeModalBtn = document.getElementById("closeModal");
        const approveReportBtn = document.getElementById("approveReport");
        const modalContent = document.getElementById("modalContent");

        tableRows.forEach(row => {
            row.addEventListener("click", function () {
                const topic = row.querySelector("span:nth-child(1)").innerText;
                const status = row.querySelector("span:nth-child(2)").innerText;
                const approveDate = row.querySelector("span:nth-child(3)").innerText || 'Not Approved';
                const description = row.querySelector("span:nth-child(4)").innerText;

                // Populate modal with report data
                modalContent.innerHTML = `
                <p><strong>Topic:</strong> ${topic}</p>
                <p><strong>Status:</strong> ${status}</p>
                <p><strong>Approve Date:</strong> ${approveDate}</p>
                <p><strong>Description:</strong> ${description}</p>
            `;

                // Show the modal
                modal.classList.remove("hidden");
            });
        });

        // Close modal button functionality
        closeModalBtn.addEventListener("click", function () {
            modal.classList.add("hidden");
        });

        // Optionally handle Approve button click (add logic here)
        approveReportBtn.addEventListener("click", function () {
            alert("Report Approved!");
            modal.classList.add("hidden");
        });
    });


</script>
</body>
</html>

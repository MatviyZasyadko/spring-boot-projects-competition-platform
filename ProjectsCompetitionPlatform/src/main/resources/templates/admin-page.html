<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Competitors - Admin page</title>
    <link th:href="@{/main.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        #reportModal {
            backdrop-filter: blur(5px); /* Adds a subtle blur effect to the background */
        }

        #reportModal .bg-white {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="bg-gray-50">
<header th:replace="~{layout/header :: header}"></header>

<main class="custom-container">
    <section class="page-block">
        <h2 class="text-3xl text-center leading-[3.75rem] font-bold font-palanquin">
            Admin panel
        </h2>
        <div class="flex justify-center">
            <div class="mt-8 max-w-sm w-full bg-white rounded-lg shadow p-4 md:p-6">
                <div class="flex justify-between">
                    <div>
                        <h5 class="leading-none text-3xl font-bold text-gray-900 pb-2">32.4k</h5>
                        <p class="text-base font-normal text-gray-500">Users this week</p>
                    </div>
                    <div
                            class="flex items-center px-2.5 py-0.5 text-base font-semibold text-green-500 text-center">
                        12%
                        <svg class="w-3 h-3 ms-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 10 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M5 13V1m0 0L1 5m4-4 4 4"/>
                        </svg>
                    </div>
                </div>
                <div id="area-chart"></div>
                <div class="grid grid-cols-1 items-center border-gray-200 border-t justify-between">
                    <div class="flex justify-between items-center pt-5">
                        <!-- Button -->
                        <button
                                id="dropdownDefaultButton"
                                data-dropdown-toggle="lastDaysdropdown"
                                data-dropdown-placement="bottom"
                                class="text-sm font-medium text-gray-500 hover:text-gray-900 text-center inline-flex items-center"
                                type="button">
                            Last 7 days
                            <svg class="w-2.5 m-2.5 ms-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                 fill="none" viewBox="0 0 10 6">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="m1 1 4 4 4-4"/>
                            </svg>
                        </button>
                        <!-- Dropdown menu -->
                        <div id="lastDaysdropdown"
                             class="z-10 hidden bg-white divide-y divide-gray-100 rounded-lg shadow w-44 ">
                            <ul class="py-2 text-sm text-gray-700"
                                aria-labelledby="dropdownDefaultButton">
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Yesterday</a>
                                </li>
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Today</a>
                                </li>
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Last
                                        7 days</a>
                                </li>
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Last
                                        30 days</a>
                                </li>
                                <li>
                                    <a href="#"
                                       class="block px-4 py-2 hover:bg-gray-100">Last
                                        90 days</a>
                                </li>
                            </ul>
                        </div>
                        <a
                                href="#"
                                class="uppercase text-sm font-semibold inline-flex items-center rounded-lg text-blue-600 hover:text-blue-700 hover:bg-gray-100 px-3 py-2">
                            Users Report
                            <svg class="w-2.5 h-2.5 ms-1.5 rtl:rotate-180" aria-hidden="true"
                                 xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="m1 9 4-4-4-4"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div> <!-- table with all reports -->
            <div class="mt-8 page-block">
                <div class="relative overflow-x-auto">
                    <div class="flex justify-center mt-3">
                        <h3 class="text-2xl text-center font-bold font-mono">
                            My reports
                        </h3>
                    </div>
                    <table class="mt-8 w-full text-sm text-left rtl:text-right">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3">
                                Topic
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Status
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Approve Date
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Description
                            </th>
                            <th scope="col" class="px-6 py-3">
                                Admin comment
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="report : ${allReports}"
                            th:attr="data-report_id=${report.getId()}"
                            class="reportRow bg-white border-b cursor-pointer">
                            <th id="topic" scope="row" class="px-6 py-4 font-medium whitespace-nowrap">
                                <span th:text="${report.topic}"></span>
                            </th>
                            <th scope="row" class="px-6 py-4 font-medium whitespace-nowrap">
                                <span th:text="${report.reportStatus}"></span>
                            </th>
                            <th scope="row" class="px-6 py-4 font-medium whitespace-nowrap">
                                <span th:text="${report.approveDate != null ? report.approveDate : 'Not Approved'}"></span>
                            </th>
                            <td class="px-6 py-4">
                                <span th:text="${report.description}"></span>
                            </td>
                            <td class="px-6 py-4">
                                <span th:text="${report.adminComment}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script>
            const options = {
                chart: {
                    height: '100%',
                    maxWidth: '100%',
                    type: 'area',
                    fontFamily: 'Inter, sans-serif',
                    dropShadow: {
                        enabled: false,
                    },
                    toolbar: {
                        show: false,
                    },
                },
                tooltip: {
                    enabled: true,
                    x: {
                        show: false,
                    },
                },
                fill: {
                    type: 'gradient',
                    gradient: {
                        opacityFrom: 0.55,
                        opacityTo: 0,
                        shade: '#1C64F2',
                        gradientToColors: ['#1C64F2'],
                    },
                },
                dataLabels: {
                    enabled: false,
                },
                stroke: {
                    width: 6,
                },
                grid: {
                    show: false,
                    strokeDashArray: 4,
                    padding: {
                        left: 2,
                        right: 2,
                        top: 0,
                    },
                },
                series: [
                    {
                        name: 'New users',
                        data: [6500, 6418, 6456, 6526, 6356, 6456],
                        color: '#1A56DB',
                    },
                ],
                xaxis: {
                    categories: ['01 February', '02 February', '03 February', '04 February', '05 February', '06 February', '07 February'],
                    labels: {
                        show: false,
                    },
                    axisBorder: {
                        show: false,
                    },
                    axisTicks: {
                        show: false,
                    },
                },
                yaxis: {
                    show: false,
                },
            };

            if (document.getElementById('area-chart') && typeof ApexCharts !== 'undefined') {
                const chart = new ApexCharts(document.getElementById('area-chart'), options);
                chart.render();
            }
        </script>

    </section>
</main>

<div id="reportModal"
     class="fixed inset-0 border-gray-300 shadow-hover bg-opacity-80 flex justify-center items-center hidden">
    <div class="bg-white p-8 rounded-lg shadow-lg w-2/3 max-w-3xl relative">
        <form th:action="@{/ui/reports/approve-reopen-report}" method="post">
            <div id="modalContent" class="space-y-6">
                <h3 id="modalTopic" class="text-3xl font-bold text-center mb-6">Report</h3>
                <div class="flex w-full justify-between">
                    <p id="modalStatus" class="w-3/4 text-lg font-bold"></p>
                    <p id="modalApproveDate" class="text-gray-700 italic w-3/4"></p>
                </div>
                <div class="flex items-start flex-col">
                    <p class="font-semibold text-gray-700 w-1/4">Description: </p>
                    <p id="modalDescription" class="text-gray-800 w-3/4"></p>
                </div>
                <div class="flex flex-col space-y-2">
                    <label for="commentInput" class="font-semibold text-gray-700">Add Comment: </label>
                    <input type="hidden" name="reportId" id="reportIdInput"/>
                    <textarea name="comment" id="commentInput"
                              class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                              rows="4" placeholder="Enter your comment..."></textarea>
                </div>
            </div>
            <div class="flex justify-around items-stretch space-x-4 mt-6 gap-2">
                <button type="submit" name="action" value="approve" style="background-color: lightgreen; color: black"
                        id="approveReport"
                        class="px-2 py-1 rounded-lg">
                    Approve
                </button>
                <button type="submit" name="action" value="reopen" style="background-color: orange; color: black"
                        id="reopenReport"
                        class="px-2 py-1 rounded-lg">
                    Reopen
                </button>
                <button type="reset" style="background-color: coral; color: black"
                        class="closeModal px-2 py-1 rounded-lg">
                    Close
                </button>
            </div>
        </form>
    </div>
</div>


<footer th:replace="~{layout/footer :: footer}"></footer>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const reportRows = document.querySelectorAll(".reportRow");
        const modal = document.getElementById("reportModal");
        const closeModalBtns = document.querySelectorAll(".closeModal");

        reportRows.forEach((reportRow) => {
            const reportId = reportRow.dataset.report_id;
            const reportContent = reportRow.children
            const status = reportContent.item(1).innerText
            reportContent.item(1).style.color = status === "APPROVED" ? "green" : "orange"
            const topic = reportContent.item(0).innerText
            const approveDate = reportContent.item(2).innerText
            const description = reportContent.item(3).innerText
            const reportComment = reportContent.item(4).innerText

            reportRow.addEventListener('click', function () {
                document.getElementById("modalTopic").textContent = topic
                document.getElementById("modalStatus").textContent = status
                document.getElementById("modalApproveDate").textContent = approveDate
                document.getElementById("modalDescription").textContent = description

                document.getElementById('reportIdInput').value = reportId;
                document.getElementById('commentInput').value = reportComment;

                modal.classList.remove("hidden");
            });
        })

        closeModalBtns.forEach((row) => {
            row.addEventListener("click", function () {
                modal.classList.add("hidden")
            })
        })
    });


</script>
</body>
</html>

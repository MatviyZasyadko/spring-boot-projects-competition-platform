<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Competitors - Create a project</title>
    <link th:href="@{/main.css}" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        .hasImage:hover section {
            background-color: rgba(5, 5, 5, 0.4);
        }

        .hasImage:hover button:hover {
            background: rgba(5, 5, 5, 0.45);
        }

        #overlay p,
        i {
            opacity: 0;
        }

        #overlay.draggedover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        #overlay.draggedover p,
        #overlay.draggedover i {
            opacity: 1;
        }

        .group:hover .group-hover\:text-blue-800 {
            color: #2b6cb0;
        }
    </style>
</head>
<body class="bg-gray-50">
<header th:replace="~{layout/header :: header}"></header>

<main class="custom-container">
    <section class="page-block">
        <div class="mx-auto my-auto max-w-3xl">
            <h2 class="text-3xl text-center leading-[3.75rem] font-bold font-palanquin">Create a project</h2>
            <form
                    th:action="@{/ui/projects/create}"
                    th:object="${projectCreateDto}"
                    method="POST"
                    enctype="multipart/form-data"
                    onsubmit="handleSubmit(event);"
            >

                <div th:if="${#fields.hasAnyErrors()}"
                     class="p-4 mt-8 text-sm text-red-800 rounded-lg bg-red-50"
                     role="alert">
                    <span class="font-medium">Error!</span> <span th:text="${#fields.allErrors().get(0)}"></span>
                </div>

                <div th:if="${error != null}"
                     class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50"
                     role="alert">
                    <span class="font-medium">Error!</span> <span th:text="${error}"></span>
                    <script>
                      window.history.replaceState(null, '', window.location.pathname);
                    </script>
                </div>

                <div class="flex flex-col items-center mt-6">
                    <div>
                        <img class="object-cover rounded-lg shadow-md h-52 w-48"
                             src="/default-image.jpg"
                             alt="Project logo"
                             id="project_logo"
                        >
                    </div>
                    <p class="text-gray-600 mt-2 text-sm">
                        Your project logo
                    </p>
                </div>
                <div class="mt-4 grid gap-6 sm:grid-cols-2 sm:gap-7">
                    <div class="sm:col-span-2">
                        <label class="block mb-2 text-sm font-medium text-gray-900" for="logo">Project
                            logo</label>
                        <input class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none"
                               id="logo" name="logo" type="file" th:field="*{logo}" accept="image/*">
                    </div>
                    <div class="sm:col-span-2">
                        <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Name<span
                                class="text-red-600">*</span></label>
                        <input type="text" name="name" id="name"
                               class="default-input block w-full p-2.5"
                               placeholder="Type project name" required th:field="*{name}">
                    </div>
                    <div class="sm:col-span-2">
                        <label for="shortDescription" class="block mb-2 text-sm font-medium text-gray-900">Short
                            description<span class="text-red-600">*</span></label>
                        <input type="text" name="shortDescription" id="shortDescription"
                               class="default-input block w-full p-2.5"
                               placeholder="Type short description" required th:field="*{shortDescription}">
                    </div>
                    <div class="sm:col-span-2">
                        <label for="fullDescription"
                               class="block mb-2 text-sm font-medium text-gray-900">Full
                            description<span class="text-red-600">*</span></label>
                        <textarea id="fullDescription" rows="8"
                                  class="block p-2.5 w-full default-input"
                                  name="fullDescription"
                                  placeholder="Type full description" th:field="*{fullDescription}"></textarea>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-900" for="logo">Project
                            images</label>
                        <div class="flex justify-between items-center mt-3">
                            <div>
                                <label class="primary-button p-2" data-tooltip-target="tooltip-default">
                                    <span>Upload project images</span>
                                    <input multiple class="hidden" id="project-images-file-input" type="file"
                                           th:field="*{images}"
                                           accept="image/*">
                                </label>
                            </div>
                            <div>
                                <button id="cancel-images" class="secondary-button p-2">
                                    Remove all images
                                </button>
                            </div>
                        </div>
                        <script>

                          //const logoInput = document.getElementById('logo');
                          //const logoImage = document.getElementById('project_logo');
                          //
                          //logoInput.onchange = function () {
                          //  let file = this.files[0];
                          //  const acceptedImageTypes = ['image/gif', 'image/jpeg', 'image/png'];
                          //
                          //  if (!acceptedImageTypes.includes(file.type)) {
                          //    this.value = null;
                          //    logoImage.src = '/default-image.jpg';
                          //    alert('Logo should be an image!');
                          //    return;
                          //  }
                          //
                          //  if (file) {
                          //    logoImage.src = URL.createObjectURL(file);
                          //  } else {
                          //    logoImage.src = '/default-image.jpg';
                          //  }
                          //};
                        </script>
                    </div>
                    <div class="sm:col-span-2">
                        <p class="mb-3">
                            <span class="mb-3 font-semibold text-sm text-gray-900">
                                Uploaded images
                            </span>
                        </p>
                        <div id="tooltip-default" role="tooltip"
                             class="absolute z-10 invisible inline-block px-3 py-2 text-sm font-medium text-white transition-opacity duration-300 bg-black rounded-lg shadow-sm opacity-0 ">
                            These images will be shown on your project page as a gallery with slider. <br> There should
                            be at least one image provided.
                            <div class="tooltip-arrow" data-popper-arrow></div>
                        </div>
                        <ul id="gallery"
                            class="flex flex-1 flex-wrap -m-1 border border-gray-300 rounded-xl p-10">
                            <li id="empty" class="h-full w-full text-center flex flex-col items-center justify-center">
                                <img class="mx-auto w-32"
                                     src="https://user-images.githubusercontent.com/507615/54591670-ac0a0180-4a65-11e9-846c-e55ffce0fe7b.png"
                                     alt="no data"
                                >
                                <p class="text-center text-gray-400 text-sm font-normal leading-4">
                                    Attach up to 5 image files (png, jpg, jpeg)
                                    at a time, total file size may not exceed 25 MB</p>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="sm:col-span-2 mt-6 flex justify-end">
                    <div>
                        <button type="submit"
                                class="primary-button px-4 py-2">
                            Create a project
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

<template id="file-template">
    <li class="block p-1 w-1/2 lg:w-1/3 h-28">
        <article tabindex="0"
                 class="group w-full h-full rounded-md focus:outline-none focus:shadow-outline elative bg-gray-100 cursor-pointer relative shadow">
            <img alt="upload preview" class="img-preview hidden w-full h-full sticky object-cover rounded-md bg-fixed" src=""/>

            <section class="flex flex-col rounded-md text-xs break-words w-full h-full z-20 absolute top-0 py-2 px-3">
                <h1 class="flex-1 group-hover:text-blue-800"></h1>
                <div class="flex">
              <span class="p-1 text-blue-800">
                <i>
                  <svg class="fill-current w-4 h-4 ml-auto pt-1" xmlns="http://www.w3.org/2000/svg" width="24"
                       height="24" viewBox="0 0 24 24">
                    <path d="M15 2v5h5v15h-16v-20h11zm1-2h-14v24h20v-18l-6-6z"/>
                  </svg>
                </i>
              </span>
                    <p class="p-1 size text-xs text-gray-700"></p>
                    <button class="delete ml-auto focus:outline-none hover:bg-gray-300 p-1 rounded-md text-gray-800">
                        <svg class="pointer-events-none fill-current w-4 h-4 ml-auto" xmlns="http://www.w3.org/2000/svg"
                             width="24" height="24" viewBox="0 0 24 24">
                            <path class="pointer-events-none"
                                  d="M3 6l3 18h12l3-18h-18zm19-4v2h-20v-2h5.711c.9 0 1.631-1.099 1.631-2h5.316c0 .901.73 2 1.631 2h5.711z"/>
                        </svg>
                    </button>
                </div>
            </section>
        </article>
    </li>
</template>

<template id="image-template">
    <li class="block p-1 w-1/2 lg:w-1/3 h-28">
        <article tabindex="0"
                 class="group hasImage w-full h-full rounded-md focus:outline-none focus:shadow-outline bg-gray-100 cursor-pointer relative text-transparent hover:text-white shadow-sm">
            <img alt="upload preview" class="img-preview w-full h-full sticky object-cover rounded-md bg-fixed"/>

            <section class="flex flex-col rounded-md text-xs break-words w-full h-full z-20 absolute top-0 py-2 px-3">
                <h1 class="flex-1"></h1>
                <div class="flex">
              <span class="p-1">
                <i>
                  <svg class="fill-current w-4 h-4 ml-auto pt-" xmlns="http://www.w3.org/2000/svg" width="24"
                       height="24" viewBox="0 0 24 24">
                    <path d="M5 8.5c0-.828.672-1.5 1.5-1.5s1.5.672 1.5 1.5c0 .829-.672 1.5-1.5 1.5s-1.5-.671-1.5-1.5zm9 .5l-2.519 4-2.481-1.96-4 5.96h14l-5-8zm8-4v14h-20v-14h20zm2-2h-24v18h24v-18z"/>
                  </svg>
                </i>
              </span>

                    <p class="p-1 size text-xs"></p>
                    <button class="delete ml-auto focus:outline-none hover:bg-gray-300 p-1 rounded-md">
                        <svg class="pointer-events-none fill-current w-4 h-4 ml-auto" xmlns="http://www.w3.org/2000/svg"
                             width="24" height="24" viewBox="0 0 24 24">
                            <path class="pointer-events-none"
                                  d="M3 6l3 18h12l3-18h-18zm19-4v2h-20v-2h5.711c.9 0 1.631-1.099 1.631-2h5.316c0 .901.73 2 1.631 2h5.711z"/>
                        </svg>
                    </button>
                </div>
            </section>
        </article>
    </li>
</template>

<script th:inline="javascript">
  const fileTemplate = document.getElementById('file-template');
  const imageTemplate = document.getElementById('image-template');
  const empty = document.getElementById('empty');

  //if (filesFromServerJson) {
  //  parsedFilesFromServer = JSON.parse(filesFromServerJson);
  //}

  let USER_FILES = {};
  let FILES_FROM_SERVER = {};

  function addFile(target, file) {
    const isImage = file.type.match('image.*'),
      objectURL = URL.createObjectURL(file);

    const clone = isImage
      ? imageTemplate.content.cloneNode(true)
      : fileTemplate.content.cloneNode(true);

    clone.querySelector('h1').textContent = file.name;
    clone.querySelector('li').id = objectURL;
    clone.querySelector('.delete').dataset.target = objectURL;

    isImage &&
    Object.assign(clone.querySelector('img'), {
      src: objectURL,
      alt: file.name,
    });

    empty.classList.add('hidden');
    target.prepend(clone);

    USER_FILES[objectURL] = file;
  }

  const gallery = document.getElementById('gallery');
  const overlay = document.getElementById('overlay');

  const hidden = document.getElementById('project-images-file-input');
  hidden.onchange = (e) => {
    for (const file of e.target.files) {
      addFile(gallery, file);
    }
  };

  const hasFiles = ({ dataTransfer: { types = [] } }) =>
    types.indexOf('Files') > -1;

  let counter = 0;

  function dropHandler(ev) {
    ev.preventDefault();
    for (const file of ev.dataTransfer.files) {
      addFile(gallery, file);
      overlay.classList.remove('draggedover');
      counter = 0;
    }
  }

  function dragEnterHandler(e) {
    e.preventDefault();
    if (!hasFiles(e)) {
      return;
    }
    ++counter && overlay.classList.add('draggedover');
  }

  function handleSubmit(event) {
    const fileInput = document.getElementById('project-images-file-input');
    const dataTransfer = new DataTransfer();
    Object.values(USER_FILES).forEach(file => dataTransfer.items.add(file));
    fileInput.files = dataTransfer.files;
  }

  gallery.onclick = ({ target }) => {
    if (target.classList.contains('delete')) {
      const ou = target.dataset.target;
      document.getElementById(ou).remove(ou);
      gallery.children.length === 1 && empty.classList.remove('hidden');
      delete USER_FILES[ou];
    }
  };

  const logoInput = document.getElementById('logo');
  const logoImage = document.getElementById('project_logo');

  logoInput.onchange = function () {
    let file = this.files[0];
    const acceptedImageTypes = ['image/gif', 'image/jpeg', 'image/png'];

    if (!acceptedImageTypes.includes(file.type)) {
      this.value = null;
      logoImage.src = '/default-image.jpg';
      alert('Logo should be an image!');
      return;
    }

    if (file) {
      logoImage.src = URL.createObjectURL(file);
    } else {
      logoImage.src = '/default-image.jpg';
    }
  };

  //document.getElementById('submit').onclick = () => {
  //  alert(`Submitted Files:\n${JSON.stringify(USER_FILES)}`);
  //  console.log(USER_FILES);
  //};
  //
  document.getElementById('cancel-images').onclick = (event) => {
    event.preventDefault();
    while (gallery.children.length > 0) {
      gallery.lastChild.remove();
    }
    USER_FILES = {};
    FILES_FROM_SERVER = {};
    empty.classList.remove('hidden');
    gallery.append(empty);
  };
</script>
</body>
</html>
